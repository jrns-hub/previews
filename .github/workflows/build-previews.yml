# Builds preview sites in the cloud from _gen/data/<slug>.json. Free on public repos.
# Add a repo secret GROQ_API_KEY for written copy; without it the pages use plain fact-based copy.
name: Build previews
on:
  push:
    paths: ["_gen/data/**"]
  schedule:
    - cron: "0 12 * * *"   # every day, 8 AM Eastern: build the next 8 highest-priority previews
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs to rebuild, space separated (blank = any data file without a page)"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _gen/generate.py ${{ github.event.inputs.slugs || '--limit 8' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKENLOG: _gen/usage.jsonl   # token counts for the Token Dashboard
      - run: |
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Build previews" && git push)
